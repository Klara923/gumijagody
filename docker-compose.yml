services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gumijagody
      POSTGRES_PASSWORD: gumijagody
      POSTGRES_DB: gumijagody
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gumijagody -d gumijagody']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgresql://gumijagody:gumijagody@db:5432/gumijagody?schema=public
      KSEF_CLIENT: ${KSEF_CLIENT:-mock}
      KSEF_API_BASE_URL: ${KSEF_API_BASE_URL:-https://api-test.ksef.mf.gov.pl/v2}
      KSEF_NIP: ${KSEF_NIP:-}
      KSEF_TOKEN: ${KSEF_TOKEN:-}
      CRON_SECRET: ${CRON_SECRET:-lokalny-sekret-dev}
      APP_PASSWORD: ${APP_PASSWORD:-gumijagoda}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:-}
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
